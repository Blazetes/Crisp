name: Complete Feature Test DMG

on:
  push:
    branches: [build/feature-test-dmg]

permissions:
  contents: read

env:
  SOURCE_REVISION: 880faf98b5df3faf264265668844b5db056c683d
  TEST_BUILD: "17007"
  ARTIFACT_NAME: Crisp-feature-test-880faf9-17007

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REVISION }}
          path: source
      - uses: actions/checkout@v5
        with:
          path: packaging
      - name: Record toolchain and source
        working-directory: source
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          git -C ../packaging rev-parse HEAD
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun swiftc --version
      - name: Verify translations
        working-directory: source
        run: python3 scripts/check-translations.py Crisp/Resources/Localizable.xcstrings
      - name: Install validation tools
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install swiftlint xcodegen
      - name: Run full upstream checks
        working-directory: source
        run: make check
      - name: Render named external UI and verify batch service
        run: ruby packaging/scripts/contribution-preview/prepare.rb source batch-display-connections packaging/build/named-preview
      - uses: actions/upload-artifact@v6
        with:
          name: named-external-preview-${{ env.TEST_BUILD }}
          path: packaging/build/named-preview/*.png
          retention-days: 30
      - name: Build complete universal app
        working-directory: source
        run: ./scripts/release.sh v1.7.0
      - name: Verify compiled image in full app
        working-directory: source
        run: |
          mkdir -p ../packaging/build/packaged-icon
          ../packaging/build/named-preview/Fixture.app/Contents/MacOS/Fixture --check-app-assets "$PWD/build/Crisp.app" ../packaging/build/packaged-icon
      - name: Prepare identified test installer
        working-directory: source
        run: |
          set -euo pipefail
          APP=build/Crisp.app
          PLIST="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName Crisp Feature Test' "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $TEST_BUILD" "$PLIST"
          /usr/libexec/PlistBuddy -c 'Set :SUEnableAutomaticChecks false' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :SUAllowsAutomaticUpdates bool false' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :SUAutomaticallyUpdate bool false' "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CrispFeatureSourceRevision string $SOURCE_REVISION" "$PLIST"
          mkdir -p build/installer deliverables
          jq -n --arg source "$(git rev-parse HEAD)" --arg tree "$(git rev-parse HEAD^{tree})" \
            --arg packaging "$(git -C ../packaging rev-parse HEAD)" --argjson build "$TEST_BUILD" \
            --arg xcode "$(xcodebuild -version)" \
            --arg sdk "$(xcrun --sdk macosx --show-sdk-version)" --arg built "$(date -u +%FT%TZ)" \
            '{sourceRevision:$source,sourceTree:$tree,packagingRevision:$packaging,testBuild:$build,packageKind:"cloud-verification",xcode:$xcode,sdk:$sdk,builtAt:$built,minimumMacOS:"14.0",architectures:["arm64","x86_64"],signing:"ad-hoc",notarized:false,features:["per-display connection switch","external-only named batch control: four columns","keep Tools expanded","equal 16:9 diagonal template SVG menu icon","late transaction safety and recovery"],automaticUpdateDefaultsDisabled:true}' \
            > "$APP/Contents/Resources/FeatureBuild.json"
          codesign --force --sign - --entitlements Crisp/Crisp.entitlements "$APP"
          codesign --verify --deep --strict "$APP"
          test -s "$APP/Contents/Resources/Assets.car"
          test -s "$APP/Contents/Resources/Metadata.appintents/extract.actionsdata"
          test -x "$APP/Contents/MacOS/crispctl"
          test -d "$APP/Contents/Frameworks/Sparkle.framework"
          test -s "$APP/Contents/Resources/zh-Hans.lproj/Localizable.strings"
          test -s "$APP/Contents/Resources/zh-Hant.lproj/Localizable.strings"
          for arch in arm64 x86_64; do
            lipo "$APP/Contents/MacOS/Crisp" -verify_arch "$arch"
            lipo "$APP/Contents/MacOS/crispctl" -verify_arch "$arch"
          done
          "$APP/Contents/MacOS/crispctl" --help
          cp "$APP/Contents/Resources/FeatureBuild.json" deliverables/FeatureBuild.json
          cp ../packaging/docs/FEATURE-TEST-INSTALL.md build/installer/INSTALL-TEST.md
          ditto "$APP" build/installer/Crisp.app
          ln -s /Applications build/installer/Applications
          git archive --format=zip --prefix=Crisp-source/ --output=deliverables/Crisp-feature-test-source.zip HEAD
          cp deliverables/Crisp-feature-test-source.zip build/installer/SourceCode.zip
          hdiutil create -volname 'Crisp Feature Test' -srcfolder build/installer \
            -ov -format UDZO deliverables/Crisp-feature-test.dmg
          hdiutil verify deliverables/Crisp-feature-test.dmg
          (cd deliverables && shasum -a 256 Crisp-feature-test.dmg Crisp-feature-test-source.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: source/deliverables/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: named-external-verification-${{ env.TEST_BUILD }}
          path: |
            packaging/build/named-preview/*.png
            packaging/build/packaged-icon/*.png
            source/build/*.xcresult
          retention-days: 30
