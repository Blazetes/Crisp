name: Combined Display Features

on:
  push:
    branches: [feature/all-display-controls]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install swiftlint xcodegen
      - name: Record validated revision
        run: git rev-parse HEAD
      - name: Run upstream checks
        run: make check
      - name: Compile combined app
        run: make compile
      - name: Check translations
        run: python3 scripts/check-translations.py Crisp/Resources/Localizable.xcstrings
